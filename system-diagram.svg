<svg viewBox="0 0 600 520" xmlns="http://www.w3.org/2000/svg" aria-label="qlawbox instrumented agent stack">
  <style>
    .node-bg { fill: #1a1a2e; stroke: #2a2a4a; stroke-width: 1.5; }
    .label-sm { font-family: ui-monospace, monospace; font-size: 9px; fill: #666; letter-spacing: 1.5px; }
    .label-main { font-family: -apple-system, sans-serif; font-size: 14px; fill: #e0e0e0; font-weight: 500; }
    .flow { stroke: #6c63ff; stroke-width: 1.5; stroke-dasharray: 4 3; opacity: 0.5; }
    .flow-label { font-family: ui-monospace, monospace; font-size: 7px; fill: #666; opacity: 0.6; }
    .grid-line { stroke: #2a2a4a; stroke-width: 0.5; opacity: 0.2; }
    .side { font-family: ui-monospace, monospace; font-size: 8px; fill: #666; }
    .measure { font-family: ui-monospace, monospace; font-size: 7px; fill: #6c63ff; opacity: 0.6; }
  </style>

  <!-- Background -->
  <rect width="600" height="520" fill="#0d0d1a" rx="8"/>
  <pattern id="g" width="26" height="26" patternUnits="userSpaceOnUse">
    <path d="M 26 0 L 0 0 0 26" fill="none" class="grid-line"/>
  </pattern>
  <rect width="600" height="520" fill="url(#g)"/>

  <!-- Layer 1: Knowledge + Learning -->
  <rect x="170" y="20" width="260" height="60" rx="8" class="node-bg"/>
  <text x="210" y="42" class="label-sm">01 · KNOWLEDGE + LEARNING</text>
  <text x="210" y="62" class="label-main">qortex</text>
  <circle cx="192" cy="50" r="10" fill="none" stroke="#6c63ff" stroke-width="1" opacity="0.6"/>
  <circle cx="188" cy="46" r="2" fill="#6c63ff" opacity="0.8"/>
  <circle cx="196" cy="46" r="2" fill="#6c63ff" opacity="0.8"/>
  <circle cx="192" cy="54" r="2" fill="#6c63ff" opacity="0.8"/>
  <line x1="188" y1="46" x2="196" y2="46" stroke="#6c63ff" stroke-width="0.7" opacity="0.5"/>
  <line x1="188" y1="46" x2="192" y2="54" stroke="#6c63ff" stroke-width="0.7" opacity="0.5"/>
  <line x1="196" y1="46" x2="192" y2="54" stroke="#6c63ff" stroke-width="0.7" opacity="0.5"/>
  <text x="436" y="55" class="side">→ rules</text>

  <!-- Flow -->
  <line x1="300" y1="80" x2="300" y2="120" class="flow">
    <animate attributeName="stroke-dashoffset" from="0" to="-14" dur="2s" repeatCount="indefinite"/>
  </line>
  <text x="310" y="105" class="flow-label">projects rules</text>

  <!-- Layer 2: Observability (core) -->
  <rect x="170" y="120" width="260" height="60" rx="8" fill="#1a1a2e" stroke="#6c63ff" stroke-width="2"/>
  <text x="210" y="139" class="label-sm" fill="#6c63ff">02 · OBSERVABILITY</text>
  <text x="210" y="157" class="label-main" font-size="13">qortex-observe</text>
  <ellipse cx="192" cy="150" rx="10" ry="6" fill="none" stroke="#6c63ff" stroke-width="1.2" opacity="0.8"/>
  <circle cx="192" cy="150" r="3" fill="#6c63ff" opacity="0.6"/>
  <rect x="170" y="120" width="260" height="60" rx="8" fill="none" stroke="#6c63ff" stroke-width="0.5" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="436" y="168" class="side" fill="#6c63ff">← core</text>

  <!-- Measurement output from the learning layer -->
  <line x1="430" y1="150" x2="540" y2="150" stroke="#6c63ff" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
  <text x="544" y="143" class="measure">RMR</text>
  <text x="544" y="153" class="measure">tokens</text>
  <text x="544" y="163" class="measure">convergence</text>

  <!-- Flow -->
  <line x1="300" y1="180" x2="300" y2="220" class="flow">
    <animate attributeName="stroke-dashoffset" from="0" to="-14" dur="2s" repeatCount="indefinite"/>
  </line>
  <text x="310" y="205" class="flow-label">instruments</text>

  <!-- Layer 3: Runtime -->
  <rect x="170" y="220" width="260" height="60" rx="8" class="node-bg"/>
  <text x="210" y="242" class="label-sm">03 · RUNTIME</text>
  <text x="210" y="262" class="label-main">vindler + bilrost</text>
  <path d="M 184 242 L 191 236 L 198 242 L 198 252 Q 191 258, 184 252 Z" fill="none" stroke="#6c63ff" stroke-width="1.2" opacity="0.6"/>
  <text x="436" y="255" class="side">→ executes</text>

  <!-- Flow -->
  <line x1="300" y1="280" x2="300" y2="320" class="flow">
    <animate attributeName="stroke-dashoffset" from="0" to="-14" dur="2s" repeatCount="indefinite"/>
  </line>
  <text x="310" y="305" class="flow-label">dispatches</text>

  <!-- Layer 4: Nervous System -->
  <rect x="170" y="320" width="260" height="60" rx="8" class="node-bg"/>
  <text x="210" y="342" class="label-sm">04 · NERVOUS SYSTEM</text>
  <text x="210" y="362" class="label-main">cadence</text>
  <path d="M 183 350 L 187 344 L 191 356 L 195 344 L 199 350" fill="none" stroke="#6c63ff" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>
  <text x="436" y="355" class="side">→ routes</text>

  <!-- External signals into cadence -->
  <line x1="60" y1="350" x2="170" y2="350" stroke="#888" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
  <text x="62" y="342" class="flow-label">external</text>
  <text x="62" y="360" class="flow-label">signals</text>
  <polygon points="170,347 164,350 170,353" fill="#888" opacity="0.4"/>

  <!-- Flow -->
  <line x1="300" y1="380" x2="300" y2="420" class="flow">
    <animate attributeName="stroke-dashoffset" from="0" to="-14" dur="2s" repeatCount="indefinite"/>
  </line>
  <text x="310" y="405" class="flow-label">state drift</text>

  <!-- Layer 5: Interoception -->
  <rect x="170" y="420" width="260" height="60" rx="8" class="node-bg"/>
  <text x="210" y="442" class="label-sm">05 · INTEROCEPTION</text>
  <text x="210" y="462" class="label-main">interoception</text>
  <circle cx="191" cy="450" r="9" fill="none" stroke="#6c63ff" stroke-width="1" opacity="0.5">
    <animate attributeName="r" values="9;10;9" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.3;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="191" cy="450" r="3" fill="#6c63ff" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Feedback loop: Interoception → learning/observability -->
  <path d="M 170 450 L 120 450 L 120 150 L 170 150" fill="none" class="flow">
    <animate attributeName="stroke-dashoffset" from="0" to="14" dur="3s" repeatCount="indefinite"/>
  </path>
  <polygon points="170,146 164,150 170,154" fill="#6c63ff" opacity="0.5"/>
  <text x="90" y="300" font-family="ui-monospace, monospace" font-size="8" fill="#6c63ff" opacity="0.6" text-anchor="middle" transform="rotate(-90, 90, 300)">affect signals ↑ feedback</text>
</svg>
